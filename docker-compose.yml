version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: adlai-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: salwa123
      POSTGRES_DB: adlai

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: