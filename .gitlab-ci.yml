# STORY-100 Phase 1: "Configure GitLab CI runner for Node.js + Playwright +
# pgvector container." This runs on any GitLab Runner that can pull Docker
# images (the default shared/docker-executor setup) -- no extra runner
# configuration needed beyond that.
#
# Three jobs:
#   1. lint:corpus-contract - fast, no DB - the new STORY-100 Phase 2 gate
#      (data/corpus/schema.json via scripts/lint_corpus_contract.js).
#   2. unit-tests           - `npm test` with no services. Per the README,
#      the integration suite self-skips when Postgres isn't reachable, so
#      this job mainly proves the unit tests (and the self-skip logic
#      itself) work.
#   3. integration-tests    - `npm test` again, this time against a real
#      pgvector/pgvector:pg17 service container (matches docker-compose.yml)
#      so the integration suite actually runs instead of skipping.
#
#      IMPORTANT: `npm run migrate` connects as the `postgres` superuser
#      (needed to run DDL, including migration 013's `CREATE ROLE`), but
#      the actual `npm test` step must connect as the non-superuser
#      `adlai_app` role migration 013 creates. src/migrations/012's own
#      comment explains why: Postgres superusers (and, even with FORCE
#      ROW LEVEL SECURITY, the table owner) bypass Row-Level Security
#      unconditionally. Running tests as `postgres` doesn't just weaken
#      the RLS check -- it silently disables it, so
#      test/integration/attorneyReviewRepository.test.js's tenant
#      isolation assertion looked like a real cross-tenant data leak
#      the first time this ran in CI. It wasn't a real bug: it was this
#      file connecting as the wrong role. Confirmed by reading
#      migrations 012/013 and src/config/database.js (which just uses
#      whatever DB_USER/DB_PASSWORD it's given, no override).

stages:
  - lint
  - test
  - release

variables:
  PLAYWRIGHT_BROWSERS_PATH: "$CI_PROJECT_DIR/.cache/ms-playwright"

.node_base:
  image: node:20
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
      - .cache/ms-playwright/
  before_script:
    - npm ci

lint:corpus-contract:
  extends: .node_base
  stage: lint
  script:
    - npm run lint:corpus

unit-tests:
  extends: .node_base
  stage: test
  script:
    - npm test

integration-tests:
  extends: .node_base
  stage: test
  # Keep this on for now -- first real run of this suite in CI (it was
  # only ever run locally, or self-skipped without a DB, before this).
  # Flip to false once it's been green for a while.
  allow_failure: true
  services:
    - name: pgvector/pgvector:pg17
      alias: postgres
  variables:
    # Superuser creds -- used only for `npm run migrate` below (DDL,
    # including migration 013's `CREATE ROLE adlai_app`).
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: salwa123
    POSTGRES_DB: adlai
    DB_HOST: postgres
    DB_PORT: "5432"
    DB_NAME: adlai
  before_script:
    - npm ci
    - npx playwright install --with-deps chromium
    - DB_USER=postgres DB_PASSWORD=salwa123 npm run migrate
  script:
    # Non-superuser app role from migration 013 -- required for RLS to
    # actually apply (see the note above the job name).
    - DB_USER=adlai_app DB_PASSWORD=adlai123 npm test

# STORY-100: on a tag push (e.g. `git tag v2026.09.16 && git push origin v2026.09.16`),
# package output/*.json + a commit-stamped manifest.json (chunk_hash
# stripped, per Alex's ask) and publish them as a GitLab generic package +
# Release, so the `adlai` side has one URL to pull a known-good, traceable
# snapshot of the corpus from instead of tracking `master` directly.
build-release-artifact:
  extends: .node_base
  stage: release
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - node scripts/build-release-manifest.js
    - tar -czf corpus-export.tar.gz -C dist/output .
    - |
      curl --fail --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        --upload-file corpus-export.tar.gz \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/corpus-export/${CI_COMMIT_TAG}/corpus-export.tar.gz"
  artifacts:
    paths:
      - corpus-export.tar.gz

publish-release:
  stage: release
  rules:
    - if: $CI_COMMIT_TAG
  needs:
    - build-release-artifact
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  script:
    - echo "Publishing release $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    description: "Corpus export $CI_COMMIT_TAG (commit $CI_COMMIT_SHA)"
    assets:
      links:
        - name: corpus-export.tar.gz
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/corpus-export/${CI_COMMIT_TAG}/corpus-export.tar.gz"
